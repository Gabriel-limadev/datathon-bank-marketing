[project]
name = "datathon-bank-marketing"
version = "0.1.0"
description = "Plataforma adaptativa de experimentação utilizando Thompson Sampling"
authors = [
    {name = "Gabriel Lima",email = "gabrielvitor180701@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.4,<0.17.0)",
    "black (>=26.5.1,<27.0.0)"
]
